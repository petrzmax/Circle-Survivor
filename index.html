<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Circle Survivor</title>
    <style>
        /* Critical styles inlined to prevent FOUC while JS/SCSS loads */
        body {
            margin: 0;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #loading-screen {
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>

        <!-- Loading screen - visible before JS loads -->
        <div id="loading-screen">Ładowanie...</div>
        
        <!-- Preact UI mount point -->
        <div id="ui-root"></div>
    </div>

    <!-- Touch joystick zone (mobile only, outside game-container to avoid transform offset) -->
    <div id="touch-zone"></div>

    <!-- Fullscreen toggle (mobile only) -->
    <button id="fullscreen-btn" aria-label="Toggle fullscreen">⛶</button>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
